<body class="bg-white min-h-screen py-10 px-4 flex flex-col items-center justify-center">

  <!-- ================= BOOK A CREATOR SECTION ================= -->
  <section class="w-full max-w-[920px] flex flex-col items-center">
    
    <!-- Outer Card Container -->
    <div class="w-full bg-[#f6f5f3] rounded-[24px] sm:rounded-[28px] pt-8 sm:pt-9 px-6 sm:px-9 md:px-10 pb-0 flex flex-col overflow-hidden relative">
      
      <!-- Top Content: Heading, Bullet List, CTA Button -->
      <div class="flex flex-col items-start w-full">
        
        <!-- Main Heading -->
        <h2 class="font-serif text-[28px] sm:text-[36px] md:text-[42px] font-normal text-[#111111] tracking-[-0.028em] leading-tight mb-5 sm:mb-6">
          Can’t find the exact face? Book a creator.
        </h2>

        <!-- Bullet List (3 Items with Purple-Blue Checkmarks) -->
        <div class="flex flex-col gap-2.5 sm:gap-2.5 mb-6 sm:mb-7">
          
          <div class="flex items-center gap-2.5">
            <svg class="w-3.5 h-3.5 text-[#5b5af7] shrink-0" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 7.5L5.5 11L12 3.5"/>
            </svg>
            <span class="text-[#525252] text-[13.5px] sm:text-[14.5px] font-normal tracking-[-0.01em]">
              40+ vetted creators, any niche, any language
            </span>
          </div>

          <div class="flex items-center gap-2.5">
            <svg class="w-3.5 h-3.5 text-[#5b5af7] shrink-0" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 7.5L5.5 11L12 3.5"/>
            </svg>
            <span class="text-[#525252] text-[13.5px] sm:text-[14.5px] font-normal tracking-[-0.01em]">
              Most orders delivered in under 48 hours
            </span>
          </div>

          <div class="flex items-center gap-2.5">
            <svg class="w-3.5 h-3.5 text-[#5b5af7] shrink-0" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 7.5L5.5 11L12 3.5"/>
            </svg>
            <span class="text-[#525252] text-[13.5px] sm:text-[14.5px] font-normal tracking-[-0.01em]">
              Full commercial rights, exclusivity on request
            </span>
          </div>

        </div>

        <!-- CTA Button & Pricing Note -->
        <div class="flex flex-wrap items-center gap-4 sm:gap-5 mb-8 sm:mb-9">
          <button onclick="window.location.href='order.html'" class="bg-[#141312] hover:bg-black text-white text-[13.5px] sm:text-[14px] font-bold px-5 sm:px-6 h-[44px] rounded-full flex items-center gap-2.5 shadow-sm hover:shadow active:scale-[0.98] transition-all whitespace-nowrap cursor-pointer tracking-[-0.01em]">
            <span>Start a custom order</span>
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 7H13M13 7L8 2M13 7L8 12"/>
            </svg>
          </button>
          <span class="text-[#7c7772] text-[13px] sm:text-[13.5px] font-normal tracking-[-0.01em]">
            from $25 per video · $250 minimum
          </span>
        </div>

      </div>
