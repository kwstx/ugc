<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Creator - Pixel Perfect</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Newsreader, Playfair Display, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-white min-h-screen py-10 px-4 flex flex-col items-center justify-center">

  <!-- ================= BOOK A CREATOR SECTION ================= -->
  <section class="w-full max-w-[920px] flex flex-col items-center">
    
    <!-- Outer Card Container -->
    <div class="w-full bg-[#f6f5f3] rounded-[24px] sm:rounded-[28px] pt-8 sm:pt-9 px-6 sm:px-9 md:px-10 pb-0 flex flex-col overflow-hidden relative">
      
      <!-- Top Content: Heading, Bullet List, CTA Button -->
      <div class="flex flex-col items-start w-full">
        
        <!-- Main Heading -->
        <h2 class="font-serif text-[28px] sm:text-[36px] md:text-[42px] font-normal text-[#111111] tracking-[-0.028em] leading-tight mb-5 sm:mb-6">
          Can’t find the exact face? Book a creator.
        </h2>

        <!-- Bullet List (3 Items with Purple-Blue Checkmarks) -->
        <div class="flex flex-col gap-2.5 sm:gap-2.5 mb-6 sm:mb-7">
          
          <div class="flex items-center gap-2.5">
            <svg class="w-3.5 h-3.5 text-[#5b5af7] shrink-0" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 7.5L5.5 11L12 3.5"/>
            </svg>
            <span class="text-[#525252] text-[13.5px] sm:text-[14.5px] font-normal tracking-[-0.01em]">
              40+ vetted creators, any niche, any language
            </span>
          </div>

          <div class="flex items-center gap-2.5">
            <svg class="w-3.5 h-3.5 text-[#5b5af7] shrink-0" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 7.5L5.5 11L12 3.5"/>
            </svg>
            <span class="text-[#525252] text-[13.5px] sm:text-[14.5px] font-normal tracking-[-0.01em]">
              Most orders delivered in under 48 hours
            </span>
          </div>

          <div class="flex items-center gap-2.5">
            <svg class="w-3.5 h-3.5 text-[#5b5af7] shrink-0" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 7.5L5.5 11L12 3.5"/>
            </svg>
            <span class="text-[#525252] text-[13.5px] sm:text-[14.5px] font-normal tracking-[-0.01em]">
              Full commercial rights, exclusivity on request
            </span>
          </div>

        </div>

        <!-- CTA Button & Pricing Note -->
        <div class="flex flex-wrap items-center gap-4 sm:gap-5 mb-8 sm:mb-9">
          <button class="bg-[#141312] hover:bg-black text-white text-[13.5px] sm:text-[14px] font-bold px-5 sm:px-6 h-[44px] rounded-full flex items-center gap-2.5 shadow-sm hover:shadow active:scale-[0.98] transition-all whitespace-nowrap cursor-pointer tracking-[-0.01em]">
            <span>Start a custom order</span>
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 7H13M13 7L8 2M13 7L8 12"/>
            </svg>
          </button>
          <span class="text-[#7c7772] text-[13px] sm:text-[13.5px] font-normal tracking-[-0.01em]">
            from $25 per video · $250 minimum
          </span>
        </div>

      </div>

      <!-- Visual Showcase: 3-Column Creator Video Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full items-start relative">
        
        <!-- Column 1 -->
        <div class="flex flex-col gap-3 w-full">
          <div class="w-full rounded-[18px] sm:rounded-[20px] overflow-hidden shadow-sm aspect-[273/364] bg-[#e5e5ea]">
            <img src="assets/book_creator/creator_shocked.png" alt="Creator shocked reaction" class="w-full h-full object-cover">
          </div>
          <div class="w-full rounded-t-[18px] sm:rounded-t-[20px] overflow-hidden shadow-sm aspect-[273/60] bg-[#e5e5ea]">
            <img src="assets/book_creator/creator_peek.png" alt="Creator peek" class="w-full h-full object-cover">
          </div>
        </div>

        <!-- Column 2 -->
        <div class="flex flex-col gap-3 w-full">
          <div class="w-full rounded-[18px] sm:rounded-[20px] overflow-hidden shadow-sm aspect-[273/122] bg-[#e5e5ea]">
            <img src="assets/book_creator/custom_order_banner.png" alt="Custom order banner" class="w-full h-full object-cover">
          </div>
          <div class="w-full rounded-[18px] sm:rounded-[20px] overflow-hidden shadow-sm aspect-[273/302] bg-[#e5e5ea]">
            <img src="assets/book_creator/creator_crying.png" alt="Creator emotional reaction" class="w-full h-full object-cover">
          </div>
        </div>

        <!-- Column 3 -->
        <div class="flex flex-col gap-3 w-full">
          <div class="w-full rounded-[18px] sm:rounded-[20px] overflow-hidden shadow-sm aspect-[273/310] bg-[#e5e5ea]">
            <img src="assets/book_creator/creator_tank.png" alt="Creator talking reaction" class="w-full h-full object-cover">
          </div>
          <div class="w-full rounded-t-[18px] sm:rounded-t-[20px] overflow-hidden shadow-sm aspect-[273/114] bg-[#e5e5ea]">
            <img src="assets/book_creator/creator_boy.png" alt="Creator mirror reaction" class="w-full h-full object-cover">
          </div>
        </div>

        <!-- Bottom Smooth Fade into Card Background -->
        <div class="pointer-events-none absolute bottom-0 left-0 right-0 h-16 sm:h-20 bg-gradient-to-t from-[#f6f5f3] via-[#f6f5f3]/80 to-transparent"></div>

      </div>

    </div>

  </section>

</body>
</html>
