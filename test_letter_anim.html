<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Reveal Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    .hero-heading {
      font-family: 'Newsreader', 'Playfair Display', Georgia, serif;
      letter-spacing: -0.028em;
      line-height: 1.14;
      font-weight: 400;
      color: #111111;
      text-align: center;
    }

    /* Statement Letter Reveal Animation */
    .char-reveal {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      filter: blur(4px);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }

    .reveal-active .char-reveal {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .char-reveal {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-8">

  <section class="w-full max-w-[1280px] py-20 px-4 text-center">
    <h2 id="statementHeading" class="hero-heading text-[24px] sm:text-[34px] md:text-[44px] lg:text-[52px] w-full max-w-6xl mx-auto leading-[1.14] text-center flex flex-col items-center justify-center">
      <span class="statement-line block w-full text-center text-[#111111] whitespace-normal md:whitespace-nowrap">
        Everything you need to make people stop scrolling.
      </span>
      <span class="statement-line block w-full text-center text-[#111111]/50 whitespace-normal md:whitespace-nowrap mt-1 sm:mt-1.5">
        Nothing you need to fake.
      </span>
    </h2>
    <div class="mt-8">
      <button onclick="replayAnimation()" class="px-4 py-2 bg-black text-white rounded-full text-sm">Replay</button>
    </div>
  </section>

  <script>
    function initLetterReveal() {
      const container = document.getElementById('statementHeading');
      if (!container) return;

      const lines = container.querySelectorAll('.statement-line');
      let globalIndex = 0;
      const charDelay = 22; // ms per letter
      const linePause = 80; // ms pause between lines

      lines.forEach((line, lineIdx) => {
        const text = line.textContent.trim();
        line.setAttribute('aria-label', text);
        line.innerHTML = '';

        if (lineIdx > 0) {
          globalIndex += Math.round(linePause / charDelay);
        }

        const words = text.split(' ');
        words.forEach((word, wordIdx) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'inline-block whitespace-nowrap';

          for (let i = 0; i < word.length; i++) {
            const charSpan = document.createElement('span');
            charSpan.className = 'char-reveal';
            charSpan.textContent = word[i];
            charSpan.style.transitionDelay = `${globalIndex * charDelay}ms`;
            wordSpan.appendChild(charSpan);
            globalIndex++;
          }

          line.appendChild(wordSpan);

          // Add spacing between words
          if (wordIdx < words.length - 1) {
            const spaceSpan = document.createElement('span');
            spaceSpan.className = 'inline-block';
            spaceSpan.innerHTML = '&nbsp;';
            line.appendChild(spaceSpan);
            globalIndex++; // slight delay tick for space
          }
        });
      });

      // Trigger reveal
      requestAnimationFrame(() => {
        container.classList.add('reveal-active');
      });
    }

    function replayAnimation() {
      const container = document.getElementById('statementHeading');
      container.classList.remove('reveal-active');
      setTimeout(() => {
        container.classList.add('reveal-active');
      }, 50);
    }

    document.addEventListener('DOMContentLoaded', initLetterReveal);
  </script>
</body>
</html>
