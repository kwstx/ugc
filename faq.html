<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ Section Wireframe</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Newsreader, Playfair Display, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-white">

  <!-- ================= FAQ SECTION (PIXEL-PERFECT WIREFRAME) ================= -->
  <section class="w-full max-w-[960px] flex flex-col items-center">
    
    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-12 w-full items-start">
      
      <!-- Left Column: Heading & Skeleton Bars -->
      <div class="md:col-span-5 flex flex-col items-start pt-1 sm:pt-2">
        <h2 class="font-serif text-[30px] sm:text-[38px] md:text-[44px] lg:text-[48px] font-normal text-[#111111] tracking-[-0.028em] leading-tight mb-2.5">
          FAQ Section
        </h2>
        <div class="flex flex-col items-start gap-[3.5px]">
          <div class="w-[120px] sm:w-[135px] h-[2px] bg-[#d8d8d8] rounded-full"></div>
          <div class="w-[85px] sm:w-[95px] h-[2px] bg-[#e4e4e4] rounded-full"></div>
        </div>
      </div>

      <!-- Right Column: 4 Question Items -->
      <div class="md:col-span-7 flex flex-col gap-3 sm:gap-3.5 w-full">
        
        <!-- Question 1 -->
        <div class="w-full bg-[#f3f3f3] hover:bg-[#ececec] rounded-[14px] sm:rounded-[16px] px-5 sm:px-6 py-4 flex items-center justify-between transition-colors cursor-pointer select-none">
          <span class="text-[14.5px] sm:text-[15.5px] font-medium text-[#262626] tracking-[-0.01em]">
            Question 1
          </span>
          <span class="text-[#555555] text-[18px] sm:text-[20px] font-light leading-none">
            +
          </span>
        </div>

        <!-- Question 2 -->
        <div class="w-full bg-[#f3f3f3] hover:bg-[#ececec] rounded-[14px] sm:rounded-[16px] px-5 sm:px-6 py-4 flex items-center justify-between transition-colors cursor-pointer select-none">
          <span class="text-[14.5px] sm:text-[15.5px] font-medium text-[#262626] tracking-[-0.01em]">
            Question 2
          </span>
          <span class="text-[#555555] text-[18px] sm:text-[20px] font-light leading-none">
            +
          </span>
        </div>

        <!-- Question 3 -->
        <div class="w-full bg-[#f3f3f3] hover:bg-[#ececec] rounded-[14px] sm:rounded-[16px] px-5 sm:px-6 py-4 flex items-center justify-between transition-colors cursor-pointer select-none">
          <span class="text-[14.5px] sm:text-[15.5px] font-medium text-[#262626] tracking-[-0.01em]">
            Question 3
          </span>
          <span class="text-[#555555] text-[18px] sm:text-[20px] font-light leading-none">
            +
          </span>
        </div>

        <!-- Question 4 -->
        <div class="w-full bg-[#f3f3f3] hover:bg-[#ececec] rounded-[14px] sm:rounded-[16px] px-5 sm:px-6 py-4 flex items-center justify-between transition-colors cursor-pointer select-none">
          <span class="text-[14.5px] sm:text-[15.5px] font-medium text-[#262626] tracking-[-0.01em]">
            Question 4
          </span>
          <span class="text-[#555555] text-[18px] sm:text-[20px] font-light leading-none">
            +
          </span>
        </div>

      </div>

    </div>

  </section>

</body>
</html>
