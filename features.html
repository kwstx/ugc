<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Features Section Wireframe</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      color: #222222;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-white">

  <!-- Features Section Header -->
  <div class="flex flex-col items-center mb-10 sm:mb-14">
    <h1 class="text-[24px] sm:text-[28px] md:text-[32px] font-bold text-[#262626] tracking-[-0.02em] leading-tight mb-2.5">
      Features Section
    </h1>
    <div class="flex flex-col items-center gap-[3.5px]">
      <div class="w-[100px] h-[2px] bg-[#d8d8d8] rounded-full"></div>
      <div class="w-[70px] h-[2px] bg-[#e4e4e4] rounded-full"></div>
    </div>
  </div>

  <!-- Bento Grid Container -->
  <div class="w-full max-w-[960px] flex flex-col gap-4 sm:gap-5 relative">
    
    <!-- Indicator Arrow on Left -->
    <div class="hidden lg:flex absolute -left-12 top-[38px] w-[32px] h-[10px] items-center">
      <svg width="30" height="10" viewBox="0 0 30 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 5H28M28 5L22 1.5M28 5L22 8.5" stroke="#222222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Highlighted Feature 1 (Top Wide Card) -->
    <div class="w-full bg-[#f3f3f3] rounded-[24px] overflow-hidden min-h-[340px] sm:min-h-[380px] md:min-h-[410px] flex justify-between pt-7 sm:pt-9 md:pt-10 pl-7 sm:pl-9 md:pl-10 pr-5 sm:pr-8 md:pr-10 pb-7 sm:pb-9">
      <div class="w-[50%] sm:w-[48%] flex flex-col justify-between">
        <div>
          <h2 class="text-[18px] sm:text-[22px] md:text-[25px] font-semibold text-[#262626] tracking-[-0.015em] mb-4 sm:mb-5">
            Highlighted Feature 1
          </h2>
          <div class="flex flex-col gap-2 sm:gap-2.5">
            <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-full max-w-[340px]"></div>
            <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-full max-w-[340px]"></div>
            <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-full max-w-[340px]"></div>
            <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-[78%] max-w-[270px]"></div>
          </div>
        </div>

        <!-- Bottom Left CTA Buttons -->
        <div class="flex items-center gap-3 mt-6 sm:mt-8 flex-wrap">
          <button 
            style="background: linear-gradient(180deg, #213ae7 0%, #475cee 50%, #7284f7 100%);"
            class="text-white text-[13.5px] sm:text-[14.5px] font-bold px-6 sm:px-7 py-2.5 sm:py-3 rounded-full shadow-[0_3px_12px_rgba(33,58,231,0.25)] hover:shadow-[0_6px_20px_rgba(33,58,231,0.4)] hover:brightness-105 active:scale-[0.98] transition-all tracking-[-0.02em] shrink-0 flex items-center justify-center cursor-pointer whitespace-nowrap"
          >
            <span>Try a search free</span>
          </button>
          <button class="bg-white hover:bg-zinc-50 border border-[#e2e8f0] text-[#18181b] text-[13px] sm:text-[14.5px] font-semibold px-5 sm:px-6 py-2.5 sm:py-3 rounded-full shadow-sm hover:border-zinc-300 active:scale-[0.98] transition-all whitespace-nowrap cursor-pointer">
            See all emotions
          </button>
        </div>
      </div>
      <div class="w-[46%] sm:w-[48%] h-[270px] sm:h-[320px] md:h-[350px] bg-white rounded-t-[20px] sm:rounded-t-[24px] self-end shrink-0"></div>
    </div>

    <!-- Bottom Row (Feature 2 & 3) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5 w-full">
      
      <!-- Highlighted Feature 2 -->
      <div class="w-full bg-[#f3f3f3] rounded-[24px] overflow-hidden min-h-[300px] sm:min-h-[350px] md:min-h-[380px] flex flex-col pt-7 sm:pt-9 md:pt-10 px-6 sm:px-8 md:px-9">
        <h2 class="text-[18px] sm:text-[22px] md:text-[25px] font-semibold text-[#262626] tracking-[-0.015em] mb-4 sm:mb-5">
          Highlighted Feature 2
        </h2>
        <div class="flex flex-col gap-2 sm:gap-2.5 mb-6 sm:mb-8">
          <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-full max-w-[340px]"></div>
          <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-full max-w-[340px]"></div>
          <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-[78%] max-w-[260px]"></div>
        </div>
        <div class="w-[82%] sm:w-[86%] h-[190px] sm:h-[230px] md:h-[250px] bg-white rounded-t-[20px] sm:rounded-t-[24px] mx-auto mt-auto"></div>
      </div>

      <!-- Highlighted Feature 3 -->
      <div class="w-full bg-[#f3f3f3] rounded-[24px] overflow-hidden min-h-[300px] sm:min-h-[350px] md:min-h-[380px] flex flex-col pt-7 sm:pt-9 md:pt-10 px-6 sm:px-8 md:px-9">
        <h2 class="text-[18px] sm:text-[22px] md:text-[25px] font-semibold text-[#262626] tracking-[-0.015em] mb-4 sm:mb-5">
          Highlighted Feature 3
        </h2>
        <div class="flex flex-col gap-2 sm:gap-2.5 mb-6 sm:mb-8">
          <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-full max-w-[340px]"></div>
          <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-full max-w-[340px]"></div>
          <div class="h-[3px] sm:h-[3.5px] bg-[#d1d1d6] rounded-full w-[78%] max-w-[260px]"></div>
        </div>
        <div class="w-[82%] sm:w-[86%] h-[190px] sm:h-[230px] md:h-[250px] bg-white rounded-t-[20px] sm:rounded-t-[24px] mx-auto mt-auto"></div>
      </div>

    </div>

  </div>

</body>
</html>
