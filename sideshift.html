<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideShift in your AI tool of choice</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 md:p-8">

  <!-- ================= SIDESHIFT AI INTEGRATION BANNER ================= -->
  <section class="w-full max-w-[980px] mx-auto pt-10 sm:pt-12 pb-12 sm:pb-16 border-t border-[#ebebeb]">
    
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-5 sm:gap-6">
      
      <!-- Left side: App Icons + Text -->
      <div class="flex items-start sm:items-center gap-4 sm:gap-5 md:gap-6">
        
        <!-- Overlapping App Icon Cluster -->
        <div class="flex items-center shrink-0 pt-0.5 sm:pt-0">
          
          <!-- Icon 1: Claude (Anthropic) -->
          <div class="w-[48px] h-[48px] sm:w-[52px] sm:h-[52px] rounded-[16px] bg-white border border-[#e4e4e7] shadow-[0_4px_12px_rgba(0,0,0,0.05),0_1px_2px_rgba(0,0,0,0.02)] flex items-center justify-center relative z-10">
            <svg class="w-[26px] h-[26px]" viewBox="0 0 24 24" fill="none">
              <path d="M4 12h16M12 4v16M6.34 6.34l11.32 11.32M17.66 6.34L6.34 17.66M8.93 4.93l6.14 14.14M15.07 4.93L8.93 19.07M4.93 8.93l14.14 6.14M4.93 15.07l14.14-6.14" stroke="#cc785c" stroke-width="2.3" stroke-linecap="round"/>
            </svg>
          </div>

          <!-- Icon 2: ChatGPT (OpenAI) -->
          <div class="w-[48px] h-[48px] sm:w-[52px] sm:h-[52px] rounded-[16px] bg-white border border-[#e4e4e7] shadow-[0_4px_12px_rgba(0,0,0,0.05),0_1px_2px_rgba(0,0,0,0.02)] flex items-center justify-center -ml-4 sm:-ml-4.5 relative z-20">
            <svg class="w-[24px] h-[24px] text-[#111111]" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.28 9.37a5.99 5.99 0 0 0-.52-4.95 6.09 6.09 0 0 0-6.41-2.91 6.03 6.03 0 0 0-4.66-2.19 6.09 6.09 0 0 0-5.8 4.22 6.03 6.03 0 0 0-3.83 2.78 6.09 6.09 0 0 0 .74 6.98 6.01 6.01 0 0 0 .52 4.95 6.09 6.09 0 0 0 6.41 2.91 6.04 6.04 0 0 0 4.66 2.19 6.09 6.09 0 0 0 5.8-4.22 6.03 6.03 0 0 0 3.83-2.78 6.09 6.09 0 0 0-.74-6.98zM12 20.08c-1.39 0-2.7-.44-3.78-1.2l.14-.08 3.12-1.8a.74.74 0 0 0 .37-.64v-4.4l1.32.76v3.62c0 2.06-1.68 3.74-3.17 3.74zm-7.6-3.84a4.57 4.57 0 0 1-.58-3.91l.14.08 3.12 1.8a.74.74 0 0 0 .74 0l3.81-2.2v1.52l-3.14 1.81a3.74 3.74 0 0 1-4.09.9zm-.94-8.08a4.58 4.58 0 0 1 2.37-3.14l.14.08 3.12 1.8a.74.74 0 0 0 .74 0l3.81 2.2-1.32.76-3.14-1.81a3.74 3.74 0 0 0-4.83.11zm11.75 3.32l-3.81-2.2 1.32-.76 3.14 1.81a3.74 3.74 0 0 1 4.09-.9 4.57 4.57 0 0 1 .58 3.91l-.14-.08-3.12-1.8a.74.74 0 0 0-.74 0l-1.32.02zm2.34-4.83a4.58 4.58 0 0 1-2.37 3.14l-.14-.08-3.12-1.8a.74.74 0 0 0-.74 0l-3.81-2.2 1.32-.76 3.14 1.81a3.74 3.74 0 0 0 4.83-.11l.89.09zm-8.89 6.27l-1.55-.9 3.81-2.2 1.55.9-3.81 2.2z"/>
            </svg>
          </div>

          <!-- Icon 3: Cursor -->
          <div class="w-[48px] h-[48px] sm:w-[52px] sm:h-[52px] rounded-[16px] bg-white border border-[#e4e4e7] shadow-[0_4px_12px_rgba(0,0,0,0.05),0_1px_2px_rgba(0,0,0,0.02)] flex items-center justify-center -ml-4 sm:-ml-4.5 relative z-30">
            <svg class="w-[25px] h-[25px]" viewBox="0 0 24 24">
              <path d="M12 2.5L3.5 7.5v9L12 21.5l8.5-5v-9L12 2.5z" fill="#111111"/>
              <path d="M12 5.8l5.2 3-5.2 7.4-2-4.2L12 5.8z" fill="#ffffff"/>
            </svg>
          </div>

        </div>

        <!-- Text Content -->
        <div>
          <h3 class="text-[17.5px] sm:text-[19px] md:text-[20px] font-bold text-[#111827] tracking-[-0.025em] leading-[1.25]">
            Use SideShift in your AI tool of choice.
          </h3>
          <p class="text-[13.5px] sm:text-[14.5px] text-[#6b7280] font-normal leading-[1.45] mt-1">
            Connect your account to find creators, review results and manage campaigns from chat.
          </p>
        </div>

      </div>

      <!-- Right side: CTA Link -->
      <div class="shrink-0 flex items-center self-start md:self-center pt-2 md:pt-0">
        <a href="#learn-more" class="inline-flex items-center gap-1.5 text-[14px] sm:text-[15px] font-semibold text-[#111827] hover:text-black transition-colors group">
          <span>Learn more</span>
          <span class="text-[17px] leading-none transition-transform group-hover:translate-x-0.5">→</span>
        </a>
      </div>

    </div>

  </section>

</body>
</html>
