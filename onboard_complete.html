<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding Status · Sofia Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .serif-heading { font-family: 'Newsreader', Georgia, serif; }
  </style>
</head>
<body class="min-h-full flex flex-col items-center justify-center p-4 bg-[#f8fafc] text-slate-900">

  <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200/90 shadow-xl overflow-hidden p-6 text-center space-y-5">
    <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    <div>
      <h1 class="text-xl font-bold tracking-tight text-slate-900">Stripe Onboarding Complete</h1>
      <p class="text-xs text-slate-500 mt-1">Checking live status directly from the Stripe Accounts V2 API...</p>
    </div>

    <div id="statusResult" class="p-4 rounded-2xl bg-slate-50 border border-slate-100 text-xs text-left space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-slate-500">Account ID:</span>
        <span id="txtAccountId" class="font-mono text-slate-800 font-semibold">-</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-slate-500">Transfers (Payouts):</span>
        <span id="txtTransfers" class="font-semibold text-slate-800">-</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-slate-500">Requirements:</span>
        <span id="txtRequirements" class="font-semibold text-slate-800">-</span>
      </div>
    </div>

    <a
      href="/connect_portal.html"
      class="w-full h-10 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs flex items-center justify-center shadow-sm transition"
    >
      Return to Connect Dashboard
    </a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const accountId = urlParams.get('accountId');

      if (!accountId) {
        document.getElementById('statusResult').innerHTML = '<span class="text-rose-600">No accountId passed in return URL.</span>';
        return;
      }

      document.getElementById('txtAccountId').textContent = accountId;

      try {
        const res = await fetch(`/api/connect/accounts/${accountId}/status`);
        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Failed to query live status');
        }

        const transfersEl = document.getElementById('txtTransfers');
        if (data.readyToReceivePayments) {
          transfersEl.className = 'font-semibold text-emerald-600';
          transfersEl.textContent = 'Active (Ready to receive payments)';
        } else {
          transfersEl.className = 'font-semibold text-amber-600';
          transfersEl.textContent = 'Inactive / Under Review';
        }

        const reqEl = document.getElementById('txtRequirements');
        if (data.onboardingComplete) {
          reqEl.className = 'font-semibold text-emerald-600';
          reqEl.textContent = 'Complete (No action due)';
        } else {
          reqEl.className = 'font-semibold text-rose-600';
          reqEl.textContent = data.requirementsStatus || 'Currently Due';
        }
      } catch (err) {
        document.getElementById('statusResult').innerHTML = `<span class="text-amber-600">Note: ${err.message}</span>`;
      }
    });
  </script>
</body>
</html>
