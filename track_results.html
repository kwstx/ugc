<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 Track results · DansUGC</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter, Newsreader, Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #111111;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Viewport Canvas matching 1024x327 reference */
    .viewport-canvas {
      position: relative;
      width: 1024px;
      height: 327px;
      background: #fafafa;
      overflow: hidden;
      margin: 0 auto;
    }

    /* ================= LEFT CONTENT SECTION ================= */
    .left-content {
      position: absolute;
      left: 135px;
      top: 0;
      width: 380px;
      height: 327px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      z-index: 10;
    }

    /* 03 Track results */
    .tag-text {
      position: absolute;
      left: 0;
      top: 93.5px;
      font-size: 11px;
      font-weight: 500;
      color: #7b838f;
      letter-spacing: -0.01em;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    /* Headline: See what performs / on organic. */
    .headline-text {
      position: absolute;
      left: 0;
      top: 125px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #1c1d20;
      letter-spacing: -0.03em;
      line-height: 1.16;
      max-width: 340px;
      user-select: none;
    }

    /* Description body */
    .paragraph-text {
      position: absolute;
      left: 0;
      top: 206px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: #7b838f;
      line-height: 1.55;
      letter-spacing: -0.01em;
      max-width: 330px;
      user-select: none;
    }

    /* ================= RIGHT VISUAL SECTION ================= */
    .right-visual-container {
      position: absolute;
      left: 500px;
      top: 0;
      width: 460px;
      height: 327px;
      z-index: 10;
    }

    /* Background Grid Pattern */
    .grid-pattern {
      position: absolute;
      top: 15px;
      left: 10px;
      width: 420px;
      height: 290px;
      background-image: 
        linear-gradient(to right, rgba(216, 226, 238, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(216, 226, 238, 0.45) 1px, transparent 1px);
      background-size: 22.5px 22.5px;
      background-position: 0px 0px;
      mask-image: radial-gradient(circle at 62% 48%, black 28%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at 62% 48%, black 28%, transparent 80%);
      pointer-events: none;
      z-index: 1;
    }

    /* Soft Cyan/Blue Glow behind Chart */
    .ambient-glow {
      position: absolute;
      top: 30px;
      left: 20px;
      width: 380px;
      height: 260px;
      background: radial-gradient(circle at 55% 45%, rgba(225, 239, 255, 0.85) 0%, rgba(240, 247, 255, 0.35) 55%, transparent 75%);
      pointer-events: none;
      z-index: 1;
    }

    /* Example campaign header */
    .chart-header {
      position: absolute;
      left: 41px;
      top: 76px;
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: -0.01em;
      user-select: none;
      z-index: 10;
    }

    /* 3 Column Metrics */
    .metrics-row {
      position: absolute;
      left: 41px;
      top: 100px;
      display: flex;
      gap: 32px;
      z-index: 10;
      user-select: none;
    }

    .metric-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 450;
      color: #64748b;
      letter-spacing: -0.01em;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 19.5px;
      font-weight: 700;
      color: #1c1d20;
      letter-spacing: -0.025em;
      line-height: 1;
    }

    /* SVG Chart & Gradient Fill */
    .chart-svg-container {
      position: absolute;
      left: 28px;
      top: 164px;
      width: 320px;
      height: 120px;
      z-index: 8;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Viewport Canvas (1024x327 reference) -->
  <div class="viewport-canvas">
    
    <!-- LEFT CONTENT: Tag, Headline, Paragraph -->
    <div class="left-content">
      
      <!-- Tag -->
      <div class="tag-text">
        <span>03</span>
        <span>Track results</span>
      </div>

      <!-- Main Headline -->
      <h2 class="headline-text">
        Test More.<br>Learn Faster.
      </h2>

      <!-- Description Body -->
      <p class="paragraph-text">
        Get multiple reactions to the same product or concept<br>and quickly discover which creative angles actually connect.
      </p>

    </div>

    <!-- RIGHT VISUAL: Grid, Glow, Metrics, Growth S-Curve -->
    <div class="right-visual-container">
      
      <!-- Background Grid & Glow -->
      <div class="grid-pattern"></div>
      <div class="ambient-glow"></div>

      <!-- Example campaign label -->
      <div class="chart-header">Example campaign</div>

      <!-- Metrics Row -->
      <div class="metrics-row">
        <!-- Metric 1 -->
        <div class="metric-col" style="width: 73px;">
          <span class="metric-label">Views</span>
          <span class="metric-value">12.4M</span>
        </div>

        <!-- Metric 2 -->
        <div class="metric-col" style="width: 73px;">
          <span class="metric-label">Creator spend</span>
          <span class="metric-value">$40.5K</span>
        </div>

        <!-- Metric 3 -->
        <div class="metric-col" style="width: 73px;">
          <span class="metric-label">CPM</span>
          <span class="metric-value">$3.27</span>
        </div>
      </div>

      <!-- SVG Curve Chart with Gradient Area Fill -->
      <svg class="chart-svg-container" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Smooth Area Gradient Fill -->
          <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28" />
            <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
          </linearGradient>
          
          <!-- Subtle Glow Filter for Curve -->
          <filter id="glowFilter" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.2" />
          </filter>
        </defs>

        <!-- Area Fill under curve -->
        <path d="M 0 84 C 115 80, 195 18, 315 4.5 L 315 120 L 0 120 Z" fill="url(#areaGradient)" />

        <!-- Crisp Blue Growth Curve Line -->
        <path d="M 0 84 C 115 80, 195 18, 315 4.5" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" filter="url(#glowFilter)" />

        <!-- Peak Blue Endpoint Dot -->
        <circle cx="315" cy="4.5" r="4.5" fill="#3b82f6" />
        <circle cx="315" cy="4.5" r="2.2" fill="#ffffff" />
      </svg>

    </div>

  </div>

</body>
</html>
